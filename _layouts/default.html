<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      {% if page.url == '/' %}
        <h1><a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}<span class="credential">,&nbsp;PhD</span></a></h1>
      {% else %}
        <p class="site-name"><a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}<span class="credential">,&nbsp;PhD</span></a></p>
      {% endif %}
      {% include navigation.html %}
    </header>
    <main>
      {{ content }}
    </main>
  </body>
</html>
